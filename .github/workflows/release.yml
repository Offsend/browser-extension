name: Release

on:
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Publish to the Chrome Web Store'
        type: boolean
        default: true
      publish_firefox:
        description: 'Publish to Firefox Add-ons'
        type: boolean
        default: true
      dry_run:
        description: 'Check access, but do not submit to the stores'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Quality gates before we ship anything to the store.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build & zip (Chrome)
        if: inputs.publish_chrome
        run: npm run zip

      - name: Build & zip (Firefox)
        if: inputs.publish_firefox
        run: npm run zip:firefox

      - name: Upload Chrome ZIP artifact
        if: inputs.publish_chrome
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: .output/*-chrome.zip
          if-no-files-found: error
          # .output is a dotfile dir; upload-artifact@v4 skips hidden paths by default.
          include-hidden-files: true

      - name: Upload Firefox ZIP artifacts
        if: inputs.publish_firefox
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
          if-no-files-found: error
          include-hidden-files: true

      # Stores are independent. A duplicate Firefox version (AMO 409) is not a
      # failure: scripts/submit-store.mjs exits 0 for that case. A real error
      # in one store still lets the other store publish.
      - name: Submit to Chrome Web Store
        id: chrome
        if: inputs.publish_chrome
        continue-on-error: true
        run: node scripts/submit-store.mjs ${{ inputs.dry_run && '--dry-run' || '' }} --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox Add-ons
        id: firefox
        if: inputs.publish_firefox
        continue-on-error: true
        run: node scripts/submit-store.mjs ${{ inputs.dry_run && '--dry-run' || '' }} --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed

      - name: Fail if a selected store submission failed
        if: always() && (steps.chrome.outcome == 'failure' || steps.firefox.outcome == 'failure')
        run: exit 1
